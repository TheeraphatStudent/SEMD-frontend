name: Frontend CI Checks

on:
  pull_request:
    branches:
      - develop
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch: {}

concurrency:
  group: frontend-ci-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check, build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out the pull request head commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Type-check and build are informational only, not required, until
      # DEV-06 (backend PredictionDetailResponse contract fix) and FE-01
      # (client regen) land: `src/services/scan.service.ts` already calls a
      # generated-client method name (`predictPredictionPost`) that doesn't
      # exist on current `develop` (`predictPredictionPredictPost` is the
      # real one), so both steps already fail on develop today, independent
      # of this PR. Verified locally: `npx tsc --noEmit` and `npm run build`
      # both fail with the same TS2551 error before this workflow existed.
      # Flip continue-on-error to false once DEV-06/FE-01 land and these
      # pass cleanly on develop.
      - name: Type-check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build
        run: npm run build
        continue-on-error: true

      # No test script exists yet (see FE-02 / SEMD backlog). Once one lands,
      # add its run step here rather than creating a second workflow file.
